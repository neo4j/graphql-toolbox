name: "Toolbox tests"

on:
  workflow_call:

jobs:
  ui-e2e-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # WebKit is CPU-bound on a 4 vCPU runner, so it takes about three times as
        # long as the other browsers. Two shards keep it in step with them.
        include:
          - { browser: chromium, shard: 1, shards: 1 }
          - { browser: firefox, shard: 1, shards: 1 }
          - { browser: webkit, shard: 1, shards: 2 }
          - { browser: webkit, shard: 2, shards: 2 }

    services:
      neo4j:
        image: neo4j:5-enterprise
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/reusable-setup/

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run @neo4j/graphql-toolbox unit tests
        if: matrix.browser == 'chromium'
        run: pnpm test:unit --run

      - name: Run @neo4j/graphql-toolbox e2e tests
        run: pnpm test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          NEO_USER: neo4j
          NEO_PASSWORD: password
          NEO_URL: bolt://localhost:7687
          DOTENV_CONFIG_QUIET: true

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-failure-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/artifacts
          retention-days: 4
