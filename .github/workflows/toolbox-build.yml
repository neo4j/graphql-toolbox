name: "Toolbox Build"

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "src/**"

jobs:
  build-graphql-toolbox:
    runs-on: ubuntu-latest

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/reusable-setup/

      - name: Build the Toolbox
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm build
          echo "$PULL_REQUEST_NUMBER" > ./dist/prnumber

      - name: Archive Toolbox build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: graphqltoolbox
          path: dist
